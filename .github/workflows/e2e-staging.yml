name: E2E Staging — Office Dashboard

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  office-contract-flow:
    name: Office create-contract flow
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_OFFICE_EMAIL: ${{ secrets.E2E_OFFICE_EMAIL }}
          E2E_OFFICE_PASSWORD: ${{ secrets.E2E_OFFICE_PASSWORD }}
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
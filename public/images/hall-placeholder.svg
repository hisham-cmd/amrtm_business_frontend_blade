<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#e8f4ed"/>
  <!-- Building body -->
  <rect x="150" y="180" width="300" height="160" fill="#c5dfd0" rx="4"/>
  <!-- Roof / triangle -->
  <polygon points="120,180 300,80 480,180" fill="#a8ccb8"/>
  <!-- Door -->
  <rect x="265" y="270" width="70" height="70" fill="#1a5c38" rx="4"/>
  <circle cx="300" cy="307" r="4" fill="#fff"/>
  <!-- Windows -->
  <rect x="175" y="220" width="55" height="45" fill="#1a5c38" rx="3" opacity="0.7"/>
  <rect x="370" y="220" width="55" height="45" fill="#1a5c38" rx="3" opacity="0.7"/>
  <!-- Columns -->
  <rect x="155" y="180" width="18" height="160" fill="#b0d4bf" rx="2"/>
  <rect x="427" y="180" width="18" height="160" fill="#b0d4bf" rx="2"/>
  <!-- Ground line -->
  <rect x="100" y="338" width="400" height="6" fill="#a8ccb8" rx="3"/>
  <!-- Icon label area -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5a8c72" font-weight="600">قاعة الأفراح</text>
</svg>
